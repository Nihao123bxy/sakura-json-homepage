<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>樱花小站</title>
  <style>
    :root {
      --bg-1: #fff7fb;
      --bg-2: #ffeaf3;
      --bg-3: #ffd3e5;
      --pink-100: #ffeaf3;
      --pink-200: #ffd3e5;
      --pink-300: #ffb3d1;
      --pink-500: #f06a9f;
      --text: #5a3a4a;
      --muted: #8d6b7a;
      --card: rgba(255, 255, 255, 0.72);
      --shadow: 0 18px 50px rgba(240, 106, 159, 0.16);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 0%, rgba(255, 255, 255, 0.55), transparent 40%),
        linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
      background-attachment: fixed;
      overflow-x: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }

    a { color: inherit; }

    .theme-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .theme-bg.show { opacity: 0.92; }

    .sakura-layer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .petal {
      position: absolute;
      top: -12vh;
      background: radial-gradient(circle at 30% 30%, #fff 0 20%, var(--pink-200) 45%, var(--pink-500) 100%);
      border-radius: 100% 0 100% 0;
      opacity: 0.75;
      animation-name: petalFall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      filter: drop-shadow(0 2px 3px rgba(240, 106, 159, 0.15));
    }

    @keyframes petalFall {
      0% { transform: translate3d(0, -12vh, 0) rotate(0deg); }
      100% { transform: translate3d(var(--drift, 12vw), 112vh, 0) rotate(720deg); }
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2) 50%, var(--bg-3));
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .loading-overlay.hidden { opacity: 0; visibility: hidden; }

    .loader-flower {
      font-size: 56px;
      animation: flowerPulse 1.2s ease-in-out infinite;
      filter: drop-shadow(0 8px 18px rgba(240, 106, 159, 0.35));
    }

    @keyframes flowerPulse {
      0%, 100% { transform: scale(1) rotate(0); }
      50% { transform: scale(1.15) rotate(18deg); }
    }

    .loading-overlay p { color: var(--muted); margin-top: 14px; letter-spacing: 0.08em; }

    .hero { position: relative; z-index: 3; padding: 72px 20px 28px; text-align: center; }
    .hero-inner { max-width: 960px; margin: 0 auto; }
    .eyebrow { margin: 0; color: var(--pink-500); letter-spacing: 0.22em; font-size: 0.78rem; font-weight: 700; }

    h1 {
      font-size: clamp(2rem, 5vw, 3.6rem);
      margin: 0.2em 0;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, var(--text), var(--pink-500) 55%, var(--pink-300));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      transition: background 0.4s ease;
    }

    .subtitle { color: var(--muted); max-width: 680px; margin: 0 auto; line-height: 1.8; }

    .hero-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    .refresh-btn {
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      background: linear-gradient(135deg, var(--pink-300), var(--pink-500));
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(240, 106, 159, 0.35);
      display: inline-flex;
      gap: 8px;
      align-items: center;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    }

    .refresh-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(240, 106, 159, 0.45); }
    .refresh-btn:disabled { opacity: 0.65; cursor: wait; }
    .refresh-icon { display: inline-block; }
    .refresh-btn.loading .refresh-icon { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status { color: var(--muted); font-size: 0.9rem; }

    .container {
      position: relative;
      z-index: 3;
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 20px 60px;
      transition: opacity 0.3s ease, filter 0.3s ease, transform 0.3s ease;
    }

    main.refreshing { opacity: 0.45; filter: blur(1px); transform: translateY(4px); }
    .section { margin-top: 28px; }

    .profile-card {
      display: flex;
      gap: 26px;
      align-items: center;
      padding: 28px;
      border-radius: 26px;
      background: var(--card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: var(--shadow);
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    .profile-card.skeleton { min-height: 150px; color: var(--muted); justify-content: center; }

    .avatar {
      flex: 0 0 112px;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      overflow: hidden;
      background: linear-gradient(135deg, var(--pink-100), var(--pink-200));
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 10px 24px rgba(240, 106, 159, 0.22);
    }

    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-placeholder { font-size: 2.6rem; font-weight: 700; color: var(--pink-500); }

    .profile-info { min-width: 0; }
    .profile-info h2 { margin: 0 0 8px; font-size: 1.7rem; }
    .bio { margin: 0; color: var(--muted); line-height: 1.8; }

    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(255, 182, 213, 0.25);
      color: var(--text);
      font-size: 0.82rem;
      border: 1px solid rgba(255, 159, 200, 0.35);
    }

    .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }

    .link-btn {
      display: inline-flex;
      align-items: center;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--pink-200);
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s, transform 0.2s;
    }

    .link-btn:hover { background: var(--pink-100); transform: translateY(-1px); }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin: 0 4px 14px;
    }

    .section-head h2 { margin: 0; font-size: 1.35rem; }
    .section-head p { margin: 0; color: var(--muted); font-size: 0.88rem; }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }

    .project-card {
      position: relative;
      display: block;
      padding: 20px;
      border-radius: 22px;
      text-decoration: none;
      background: var(--card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: var(--shadow);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s, background 0.4s ease;
      overflow: hidden;
    }

    .project-card::after {
      content: "";
      position: absolute;
      inset: auto -30% -60% auto;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(255, 159, 200, 0.22), transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .project-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 45px rgba(240, 106, 159, 0.22);
      border-color: var(--pink-300);
    }

    .project-card.no-link { cursor: default; }
    .project-card.no-link:hover { transform: none; }

    .project-icon { font-size: 1.9rem; line-height: 1; margin-bottom: 12px; }
    .project-title { margin: 0 0 8px; font-size: 1.1rem; }
    .project-desc { margin: 0; color: var(--muted); line-height: 1.7; font-size: 0.92rem; }
    .project-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .project-tags .tag { font-size: 0.75rem; padding: 4px 8px; }

    .empty {
      grid-column: 1 / -1;
      padding: 30px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--pink-300);
      border-radius: 18px;
      background: var(--card);
    }

    .footer {
      position: relative;
      z-index: 3;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 20px 20px 40px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 20px);
      z-index: 10006;
      background: rgba(90, 58, 74, 0.92);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      max-width: calc(100vw - 40px);
      text-align: center;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { background: rgba(181, 72, 115, 0.95); }

    .appear { animation: fadeInUp 0.55s ease both; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .theme-switcher {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10005;
      font-family: inherit;
    }

    .theme-toggle {
      border: 1px solid var(--pink-200);
      border-radius: 999px;
      padding: 10px 16px;
      background: var(--card);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(240, 106, 159, 0.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 0.2s, background 0.2s;
    }

    .theme-toggle:hover { transform: translateY(-1px); background: var(--pink-100); }

    .theme-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 150px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--pink-200);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
      transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
    }

    .theme-menu.open { opacity: 1; visibility: visible; transform: translateY(0); }

    .theme-item {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      text-align: left;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s, border-color 0.2s;
    }

    .theme-item:hover { background: var(--pink-100); }

    .theme-item.active {
      background: var(--pink-100);
      border-color: var(--pink-300);
      font-weight: 700;
    }

    @media (max-width: 640px) {
      .profile-card { flex-direction: column; text-align: center; padding: 24px; }
      .avatar { width: 96px; height: 96px; flex-basis: 96px; }
      .links, .tags { justify-content: center; }
      .section-head { flex-direction: column; align-items: flex-start; }
      .hero { padding-top: 72px; }
      .theme-switcher { top: 12px; right: 12px; }
      .theme-toggle { padding: 9px 13px; font-size: 0.86rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .petal { animation: none; display: none; }
      .appear, .refresh-btn.loading .refresh-icon, .loader-flower { animation: none; }
    }
  </style>
  <style id="theme-css"></style>
</head>
<body>
  <div class="theme-bg" id="themeBg" aria-hidden="true"></div>
  <div class="sakura-layer" id="sakuraLayer" aria-hidden="true"></div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loader-flower">🌸</div>
    <p>正在加载小站...</p>
  </div>

  <div class="theme-switcher" id="themeSwitcher">
    <button id="themeToggle" class="theme-toggle" type="button" aria-expanded="false">
      🎨 主题
    </button>
    <div id="themeMenu" class="theme-menu" role="menu"></div>
  </div>

  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow" id="siteEyebrow">SAKURA PORTFOLIO</p>
      <h1 id="siteTitle">樱花小站</h1>
      <p class="subtitle" id="siteSubtitle">正在读取 index.json...</p>
      <div class="hero-actions">
        <button id="refreshBtn" class="refresh-btn" type="button">
          <span class="refresh-icon">↻</span>
          <span>手动拉取刷新</span>
        </button>
        <span id="statusText" class="status">尚未加载</span>
      </div>
    </div>
  </header>

  <main class="container" id="mainContent">
    <section class="section">
      <div id="profileCard" class="profile-card skeleton">正在读取个人介绍...</div>
    </section>
    <section class="section">
      <div class="section-head">
        <h2>项目小卡片</h2>
        <p>点击卡片跳转到对应地址</p>
      </div>
      <div id="projectsGrid" class="projects-grid"></div>
    </section>
  </main>

  <footer id="footer" class="footer"></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      "use strict";

      const DATA_URL = "index.json";
      const THEMES_URL = "themes.json";
      const THEME_KEY = "sakura-theme";
      const $ = (id) => document.getElementById(id);

      const DEFAULT_THEMES = [
        {
          id: "sakura",
          name: "樱花",
          variables: {
            "--bg-1": "#fff7fb", "--bg-2": "#ffeaf3", "--bg-3": "#ffd3e5",
            "--pink-100": "#ffeaf3", "--pink-200": "#ffd3e5", "--pink-300": "#ffb3d1",
            "--pink-500": "#f06a9f", "--text": "#5a3a4a", "--muted": "#8d6b7a",
            "--card": "rgba(255, 255, 255, 0.72)", "--shadow": "0 18px 50px rgba(240, 106, 159, 0.16)"
          },
          background: "", css: ""
        },
        {
          id: "night",
          name: "夜间",
          variables: {
            "--bg-1": "#1a1622", "--bg-2": "#221c2c", "--bg-3": "#2e263a",
            "--pink-100": "#2a2333", "--pink-200": "#3d3348", "--pink-300": "#57476a",
            "--pink-500": "#c792ea", "--text": "#e8e3f0", "--muted": "#a89bb8",
            "--card": "rgba(40, 34, 52, 0.72)", "--shadow": "0 18px 50px rgba(0, 0, 0, 0.45)"
          },
          background: "", css: ""
        }
      ];

      let themes = DEFAULT_THEMES.slice();
      let defaultThemeId = DEFAULT_THEMES[0].id;
      let activeThemeId = "";
      let loading = false;
      let toastTimer = null;
      let themeMenuOpen = false;

      function createSakura() {
        const layer = $("sakuraLayer");
        layer.innerHTML = "";
        for (let i = 0; i < 24; i++) {
          const petal = document.createElement("span");
          petal.className = "petal";
          const size = 8 + Math.random() * 10;
          petal.style.left = Math.random() * 100 + "vw";
          petal.style.width = size + "px";
          petal.style.height = size + "px";
          petal.style.opacity = (0.35 + Math.random() * 0.4).toFixed(2);
          petal.style.animationDuration = (8 + Math.random() * 10).toFixed(2) + "s";
          petal.style.animationDelay = (-Math.random() * 20).toFixed(2) + "s";
          petal.style.setProperty("--drift", (Math.random() * 30 - 15).toFixed(2) + "vw");
          layer.appendChild(petal);
        }
      }

      function safeUrl(url) {
        if (!url) return "#";
        const s = String(url).trim();
        if (!s) return "#";
        if (/^(https?:\/\/|mailto:|tel:|\/\/|\/|\.\/|#|data:)/i.test(s)) return s;
        return "https://" + s;
      }

      function createTag(text) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = text;
        return span;
      }

      function showToast(message, isError) {
        const toast = $("toast");
        toast.textContent = message;
        toast.classList.toggle("error", Boolean(isError));
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2800);
      }

      function setStatus(text) { $("statusText").textContent = text; }

      function makeAvatarPlaceholder(nameOrEmoji) {
        const div = document.createElement("div");
        div.className = "avatar-placeholder";
        const text = String(nameOrEmoji || "🌸").trim();
        div.textContent = text.charAt(0) || "🌸";
        return div;
      }

      /* ---------- 主题 ---------- */

      function normalizeThemes(source) {
        if (source && Array.isArray(source.themes) && source.themes.length) {
          const list = source.themes.filter(function (t) {
            return t && typeof t === "object" && t.id;
          });
          if (list.length) {
            return {
              themes: list,
              defaultId: source.default && list.some(function (t) { return t.id === source.default; })
                ? source.default
                : list[0].id
            };
          }
        }
        return { themes: DEFAULT_THEMES.slice(), defaultId: DEFAULT_THEMES[0].id };
      }

      function findTheme(id) {
        return themes.find(function (t) { return t.id === id; }) || themes[0];
      }

      function renderThemeMenu() {
        const menu = $("themeMenu");
        menu.innerHTML = "";

        if (themes.length <= 1) {
          $("themeSwitcher").style.display = "none";
          return;
        }

        $("themeSwitcher").style.display = "";

        themes.forEach(function (theme) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "theme-item" + (theme.id === activeThemeId ? " active" : "");
          btn.textContent = theme.name || theme.id;
          btn.setAttribute("role", "menuitem");
          btn.addEventListener("click", function () {
            applyThemeById(theme.id);
            setThemeMenuOpen(false);
          });
          menu.appendChild(btn);
        });
      }

      function applyThemeById(id) {
        const theme = findTheme(id);
        if (!theme) return;

        activeThemeId = theme.id;
        const root = document.documentElement;

        const vars = theme.variables || {};
        Object.keys(vars).forEach(function (key) {
          root.style.setProperty(key, vars[key]);
        });

        const bgLayer = $("themeBg");
        if (theme.background) {
          const value = /^(url\(|data:)/i.test(String(theme.background).trim())
            ? String(theme.background).trim()
            : 'url("' + String(theme.background).trim() + '")';
          bgLayer.style.backgroundImage = value;
          bgLayer.classList.add("show");
        } else {
          bgLayer.style.backgroundImage = "";
          bgLayer.classList.remove("show");
        }

        $("theme-css").textContent = theme.css || "";

        try { localStorage.setItem(THEME_KEY, theme.id); } catch (e) {}

        renderThemeMenu();
      }

      function setThemeMenuOpen(open) {
        themeMenuOpen = open;
        $("themeMenu").classList.toggle("open", open);
        $("themeToggle").setAttribute("aria-expanded", String(open));
      }

      function initThemes(source) {
        const normalized = normalizeThemes(source);
        themes = normalized.themes;
        defaultThemeId = normalized.defaultId;

        let remembered = "";
        try { remembered = localStorage.getItem(THEME_KEY) || ""; } catch (e) {}

        const rememberedValid = remembered && themes.some(function (t) { return t.id === remembered; });
        applyThemeById(rememberedValid ? remembered : defaultThemeId);
      }

      /* ---------- 渲染 ---------- */

      function renderProfile(profile) {
        const card = $("profileCard");
        card.innerHTML = "";
        card.classList.remove("skeleton");

        const avatarWrap = document.createElement("div");
        avatarWrap.className = "avatar";
        const avatar = profile.avatar;

        if (avatar && /^(https?:\/\/|data:|\/\/|\/|\.\/)/i.test(String(avatar))) {
          const img = document.createElement("img");
          img.src = avatar;
          img.alt = profile.name || "头像";
          img.onerror = function () {
            avatarWrap.innerHTML = "";
            avatarWrap.appendChild(makeAvatarPlaceholder(profile.name));
          };
          avatarWrap.appendChild(img);
        } else {
          avatarWrap.appendChild(makeAvatarPlaceholder(avatar || profile.name));
        }

        const info = document.createElement("div");
        info.className = "profile-info";

        const h2 = document.createElement("h2");
        h2.textContent = profile.name || "你的名字";
        info.appendChild(h2);

        if (profile.bio) {
          const bio = document.createElement("p");
          bio.className = "bio";
          bio.textContent = profile.bio;
          info.appendChild(bio);
        }

        if (Array.isArray(profile.tags) && profile.tags.length) {
          const tags = document.createElement("div");
          tags.className = "tags";
          profile.tags.forEach(function (tag) { tags.appendChild(createTag(tag)); });
          info.appendChild(tags);
        }

        if (Array.isArray(profile.links) && profile.links.length) {
          const links = document.createElement("div");
          links.className = "links";
          profile.links.forEach(function (link) {
            if (!link || !link.url) return;
            const a = document.createElement("a");
            a.className = "link-btn";
            a.href = safeUrl(link.url);
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = link.label || "链接";
            links.appendChild(a);
          });
          info.appendChild(links);
        }

        card.appendChild(avatarWrap);
        card.appendChild(info);
      }

      function renderProjects(projects) {
        const grid = $("projectsGrid");
        grid.innerHTML = "";

        if (!Array.isArray(projects) || projects.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "暂无项目，请在 index.json 的 projects 中添加。";
          grid.appendChild(empty);
          return;
        }

        projects.forEach(function (project) {
          const hasUrl = project.url && String(project.url).trim();
          const card = document.createElement(hasUrl ? "a" : "div");
          card.className = "project-card";

          if (hasUrl) {
            card.href = safeUrl(project.url);
            card.target = "_blank";
            card.rel = "noopener noreferrer";
          } else {
            card.classList.add("no-link");
          }

          const icon = document.createElement("div");
          icon.className = "project-icon";
          icon.textContent = project.icon || "🌸";
          card.appendChild(icon);

          const title = document.createElement("h3");
          title.className = "project-title";
          title.textContent = project.title || "未命名项目";
          card.appendChild(title);

          if (project.description) {
            const desc = document.createElement("p");
            desc.className = "project-desc";
            desc.textContent = project.description;
            card.appendChild(desc);
          }

          if (Array.isArray(project.tags) && project.tags.length) {
            const tags = document.createElement("div");
            tags.className = "project-tags";
            project.tags.forEach(function (tag) { tags.appendChild(createTag(tag)); });
            card.appendChild(tags);
          }

          grid.appendChild(card);
        });
      }

      function render(data) {
        const site = data.site || {};
        document.title = site.title || "樱花小站";
        $("siteEyebrow").textContent = site.eyebrow || "SAKURA PORTFOLIO";
        $("siteTitle").textContent = site.title || "樱花小站";
        $("siteSubtitle").textContent = site.subtitle || "";
        $("footer").textContent = site.footer || "© " + new Date().getFullYear() + " 樱花小站";

        renderProfile(data.profile || {});
        renderProjects(Array.isArray(data.projects) ? data.projects : []);

        document.querySelectorAll(".profile-card, .project-card").forEach(function (el, index) {
          el.classList.remove("appear");
          void el.offsetWidth;
          el.classList.add("appear");
          el.style.animationDelay = index * 60 + "ms";
        });
      }

      /* ---------- 加载 ---------- */

      async function fetchJson(url) {
        const response = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status + " · " + url);
        let text = await response.text();
        text = text.replace(/^\uFEFF/, "");
        return JSON.parse(text);
      }

      async function loadAll(isManual) {
        if (loading) return;
        loading = true;

        const refreshBtn = $("refreshBtn");
        const mainContent = $("mainContent");
        refreshBtn.disabled = true;
        refreshBtn.classList.add("loading");
        mainContent.classList.add("refreshing");
        setStatus(isManual ? "正在手动拉取..." : "正在加载...");

        try {
          const results = await Promise.allSettled([
            fetchJson(DATA_URL),
            fetchJson(THEMES_URL)
          ]);

          const dataResult = results[0];
          const themesResult = results[1];

          if (dataResult.status !== "fulfilled") {
            throw dataResult.reason;
          }

          const data = dataResult.value;

          if (!data || typeof data !== "object" || Array.isArray(data)) {
            throw new Error("index.json 根节点必须是一个对象");
          }

          let themeSource = null;
          if (themesResult.status === "fulfilled") {
            themeSource = themesResult.value;
          } else if (data.theme) {
            themeSource = data.theme;
          }

          initThemes(themeSource);
          render(data);

          const time = new Date().toLocaleTimeString("zh-CN", { hour12: false });
          setStatus((isManual ? "手动刷新成功" : "加载成功") + " · " + time);
          if (isManual) showToast("已拉取最新数据 🌸");
        } catch (error) {
          console.error(error);
          setStatus("加载失败");
          showToast("加载失败：" + error.message, true);
        } finally {
          loading = false;
          refreshBtn.disabled = false;
          refreshBtn.classList.remove("loading");
          mainContent.classList.remove("refreshing");
          $("loadingOverlay").classList.add("hidden");
        }
      }

      $("refreshBtn").addEventListener("click", function () { loadAll(true); });

      $("themeToggle").addEventListener("click", function (event) {
        event.stopPropagation();
        setThemeMenuOpen(!themeMenuOpen);
      });

      document.addEventListener("click", function (event) {
        if (themeMenuOpen && !$("themeSwitcher").contains(event.target)) {
          setThemeMenuOpen(false);
        }
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && themeMenuOpen) {
          setThemeMenuOpen(false);
        }
      });

      createSakura();
      initThemes(null);
      loadAll(false);
    })();
  </script>
</body>
</html>
