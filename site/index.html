<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>樱花小站</title>
  <style>
    :root {
      --pink-100: #ffeaf3;
      --pink-200: #ffd3e5;
      --pink-300: #ffb3d1;
      --pink-500: #f06a9f;
      --text: #5a3a4a;
      --muted: #8d6b7a;
      --card: rgba(255, 255, 255, 0.72);
      --shadow: 0 18px 50px rgba(240, 106, 159, 0.16);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 0%, #fff, transparent 40%),
        linear-gradient(135deg, #fff7fb 0%, #ffeaf3 45%, #ffd3e5 100%);
      overflow-x: hidden;
    }
    a { color: inherit; }
    .sakura-layer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .petal {
      position: absolute; top: -12vh;
      background: radial-gradient(circle at 30% 30%, #fff 0 20%, #ffc2dc 45%, #ff9fc8 100%);
      border-radius: 100% 0 100% 0; opacity: 0.75;
      animation-name: petalFall; animation-timing-function: linear; animation-iteration-count: infinite;
      filter: drop-shadow(0 2px 3px rgba(240, 106, 159, 0.15));
    }
    @keyframes petalFall {
      0% { transform: translate3d(0, -12vh, 0) rotate(0deg); }
      100% { transform: translate3d(var(--drift, 12vw), 112vh, 0) rotate(720deg); }
    }
    .loading-overlay {
      position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #fff7fb, #ffeaf3 50%, #ffd3e5);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    .loading-overlay.hidden { opacity: 0; visibility: hidden; }
    .loader-flower {
      font-size: 56px; animation: flowerPulse 1.2s ease-in-out infinite;
      filter: drop-shadow(0 8px 18px rgba(240, 106, 159, 0.35));
    }
    @keyframes flowerPulse {
      0%, 100% { transform: scale(1) rotate(0); }
      50% { transform: scale(1.15) rotate(18deg); }
    }
    .loading-overlay p { color: var(--muted); margin-top: 14px; letter-spacing: 0.08em; }
    .hero { position: relative; z-index: 2; padding: 72px 20px 28px; text-align: center; }
    .hero-inner { max-width: 960px; margin: 0 auto; }
    .eyebrow { margin: 0; color: #c55b86; letter-spacing: 0.22em; font-size: 0.78rem; font-weight: 700; }
    h1 {
      font-size: clamp(2rem, 5vw, 3.6rem); margin: 0.2em 0; letter-spacing: 0.04em;
      background: linear-gradient(135deg, #b54873, #f06a9f 55%, #ff9fc8);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .subtitle { color: var(--muted); max-width: 680px; margin: 0 auto; line-height: 1.8; }
    .hero-actions { display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; margin-top: 24px; }
    .refresh-btn {
      border: none; border-radius: 999px; padding: 12px 20px;
      background: linear-gradient(135deg, #ff9fc8, #f06a9f); color: #fff; font-weight: 700;
      cursor: pointer; box-shadow: 0 10px 25px rgba(240, 106, 159, 0.35);
      display: inline-flex; gap: 8px; align-items: center;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    }
    .refresh-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(240, 106, 159, 0.45); }
    .refresh-btn:disabled { opacity: 0.65; cursor: wait; }
    .refresh-icon { display: inline-block; }
    .refresh-btn.loading .refresh-icon { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { color: var(--muted); font-size: 0.9rem; }
    .container {
      position: relative; z-index: 2; max-width: 1080px; margin: 0 auto; padding: 0 20px 60px;
      transition: opacity 0.3s ease, filter 0.3s ease, transform 0.3s ease;
    }
    main.refreshing { opacity: 0.45; filter: blur(1px); transform: translateY(4px); }
    .section { margin-top: 28px; }
    .profile-card {
      display: flex; gap: 26px; align-items: center; padding: 28px; border-radius: 26px;
      background: var(--card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.85); box-shadow: var(--shadow);
    }
    .profile-card.skeleton { min-height: 150px; color: var(--muted); justify-content: center; }
    .avatar {
      flex: 0 0 112px; width: 112px; height: 112px; border-radius: 50%; overflow: hidden;
      background: linear-gradient(135deg, #ffeaf3, #ffd3e5); display: flex; align-items: center; justify-content: center;
      border: 4px solid rgba(255, 255, 255, 0.9); box-shadow: 0 10px 24px rgba(240, 106, 159, 0.22);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-placeholder { font-size: 2.6rem; font-weight: 700; color: #f06a9f; }
    .profile-info { min-width: 0; }
    .profile-info h2 { margin: 0 0 8px; font-size: 1.7rem; }
    .bio { margin: 0; color: var(--muted); line-height: 1.8; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .tag {
      display: inline-flex; align-items: center; padding: 5px 10px; border-radius: 999px;
      background: rgba(255, 182, 213, 0.35); color: #a03d68; font-size: 0.82rem;
      border: 1px solid rgba(255, 159, 200, 0.35);
    }
    .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .link-btn {
      display: inline-flex; align-items: center; padding: 8px 14px; border-radius: 999px;
      background: #fff; border: 1px solid var(--pink-200); color: #b54873;
      text-decoration: none; font-size: 0.9rem; font-weight: 600;
      transition: background 0.2s, transform 0.2s;
    }
    .link-btn:hover { background: var(--pink-100); transform: translateY(-1px); }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin: 0 4px 14px; }
    .section-head h2 { margin: 0; font-size: 1.35rem; }
    .section-head p { margin: 0; color: var(--muted); font-size: 0.88rem; }
    .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; }
    .project-card {
      position: relative; display: block; padding: 20px; border-radius: 22px; text-decoration: none;
      background: var(--card); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.85); box-shadow: 0 12px 34px rgba(240, 106, 159, 0.12);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s; overflow: hidden;
    }
    .project-card::after {
      content: ""; position: absolute; inset: auto -30% -60% auto; width: 140px; height: 140px;
      background: radial-gradient(circle, rgba(255, 159, 200, 0.28), transparent 70%);
      border-radius: 50%; pointer-events: none;
    }
    .project-card:hover { transform: translateY(-5px); box-shadow: 0 20px 45px rgba(240, 106, 159, 0.22); border-color: rgba(255, 159, 200, 0.75); }
    .project-card.no-link { cursor: default; }
    .project-card.no-link:hover { transform: none; }
    .project-icon { font-size: 1.9rem; line-height: 1; margin-bottom: 12px; }
    .project-title { margin: 0 0 8px; font-size: 1.1rem; }
    .project-desc { margin: 0; color: var(--muted); line-height: 1.7; font-size: 0.92rem; }
    .project-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .project-tags .tag { font-size: 0.75rem; padding: 4px 8px; }
    .empty {
      grid-column: 1 / -1; padding: 30px; text-align: center; color: var(--muted);
      border: 1px dashed var(--pink-300); border-radius: 18px; background: rgba(255, 255, 255, 0.45);
    }
    .footer { position: relative; z-index: 2; text-align: center; color: var(--muted); font-size: 0.85rem; padding: 20px 20px 40px; }
    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); z-index: 10006;
      background: rgba(90, 58, 74, 0.92); color: #fff; padding: 10px 18px; border-radius: 999px;
      font-size: 0.9rem; opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s;
      max-width: calc(100vw - 40px); text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { background: rgba(181, 72, 115, 0.95); }
    .appear { animation: fadeInUp 0.55s ease both; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 640px) {
      .profile-card { flex-direction: column; text-align: center; padding: 24px; }
      .avatar { width: 96px; height: 96px; flex-basis: 96px; }
      .links, .tags { justify-content: center; }
      .section-head { flex-direction: column; align-items: flex-start; }
      .hero { padding-top: 56px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .petal { animation: none; display: none; }
      .appear, .refresh-btn.loading .refresh-icon, .loader-flower { animation: none; }
    }
  </style>
</head>
<body>
  <div class="sakura-layer" id="sakuraLayer" aria-hidden="true"></div>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loader-flower">🌸</div>
    <p>正在加载小站...</p>
  </div>

  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow" id="siteEyebrow">SAKURA PORTFOLIO</p>
      <h1 id="siteTitle">樱花小站</h1>
      <p class="subtitle" id="siteSubtitle">正在读取 index.json...</p>
      <div class="hero-actions">
        <button id="refreshBtn" class="refresh-btn" type="button">
          <span class="refresh-icon">↻</span>
          <span>手动拉取刷新</span>
        </button>
        <span id="statusText" class="status">尚未加载</span>
      </div>
    </div>
  </header>

  <main class="container" id="mainContent">
    <section class="section">
      <div id="profileCard" class="profile-card skeleton">正在读取个人介绍...</div>
    </section>
    <section class="section">
      <div class="section-head">
        <h2>项目小卡片</h2>
        <p>点击卡片跳转到对应地址</p>
      </div>
      <div id="projectsGrid" class="projects-grid"></div>
    </section>
  </main>

  <footer id="footer" class="footer"></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      "use strict";
      const DATA_URL = "index.json";
      const $ = (id) => document.getElementById(id);
      let loading = false;
      let toastTimer = null;

      function createSakura() {
        const layer = $("sakuraLayer");
        layer.innerHTML = "";
        for (let i = 0; i < 24; i++) {
          const petal = document.createElement("span");
          petal.className = "petal";
          const size = 8 + Math.random() * 10;
          petal.style.left = Math.random() * 100 + "vw";
          petal.style.width = size + "px";
          petal.style.height = size + "px";
          petal.style.opacity = (0.35 + Math.random() * 0.4).toFixed(2);
          petal.style.animationDuration = (8 + Math.random() * 10).toFixed(2) + "s";
          petal.style.animationDelay = (-Math.random() * 20).toFixed(2) + "s";
          petal.style.setProperty("--drift", (Math.random() * 30 - 15).toFixed(2) + "vw");
          layer.appendChild(petal);
        }
      }

      function safeUrl(url) {
        if (!url) return "#";
        const s = String(url).trim();
        if (!s) return "#";
        if (/^(https?:\/\/|mailto:|tel:|\/\/|\/|\.\/|#)/i.test(s)) return s;
        return "https://" + s;
      }

      function createTag(text) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = text;
        return span;
      }

      function showToast(message, isError) {
        const toast = $("toast");
        toast.textContent = message;
        toast.classList.toggle("error", Boolean(isError));
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2800);
      }

      function setStatus(text) { $("statusText").textContent = text; }

      function makeAvatarPlaceholder(nameOrEmoji) {
        const div = document.createElement("div");
        div.className = "avatar-placeholder";
        const text = String(nameOrEmoji || "🌸").trim();
        div.textContent = text.charAt(0) || "🌸";
        return div;
      }

      function renderProfile(profile) {
        const card = $("profileCard");
        card.innerHTML = "";
        card.classList.remove("skeleton");
        const avatarWrap = document.createElement("div");
        avatarWrap.className = "avatar";
        const avatar = profile.avatar;
        if (avatar && /^(https?:\/\/|\/\/|\/|\.\/)/i.test(String(avatar))) {
          const img = document.createElement("img");
          img.src = avatar;
          img.alt = profile.name || "头像";
          img.onerror = () => {
            avatarWrap.innerHTML = "";
            avatarWrap.appendChild(makeAvatarPlaceholder(profile.name));
          };
          avatarWrap.appendChild(img);
        } else {
          avatarWrap.appendChild(makeAvatarPlaceholder(avatar || profile.name));
        }

        const info = document.createElement("div");
        info.className = "profile-info";
        const h2 = document.createElement("h2");
        h2.textContent = profile.name || "你的名字";
        info.appendChild(h2);

        if (profile.bio) {
          const bio = document.createElement("p");
          bio.className = "bio";
          bio.textContent = profile.bio;
          info.appendChild(bio);
        }

        if (Array.isArray(profile.tags) && profile.tags.length) {
          const tags = document.createElement("div");
          tags.className = "tags";
          profile.tags.forEach(tag => tags.appendChild(createTag(tag)));
          info.appendChild(tags);
        }

        if (Array.isArray(profile.links) && profile.links.length) {
          const links = document.createElement("div");
          links.className = "links";
          profile.links.forEach(link => {
            if (!link || !link.url) return;
            const a = document.createElement("a");
            a.className = "link-btn";
            a.href = safeUrl(link.url);
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = link.label || "链接";
            links.appendChild(a);
          });
          info.appendChild(links);
        }

        card.appendChild(avatarWrap);
        card.appendChild(info);
      }

      function renderProjects(projects) {
        const grid = $("projectsGrid");
        grid.innerHTML = "";
        if (!Array.isArray(projects) || projects.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "暂无项目，请在 index.json 的 projects 中添加。";
          grid.appendChild(empty);
          return;
        }

        projects.forEach(project => {
          const hasUrl = project.url && String(project.url).trim();
          const card = document.createElement(hasUrl ? "a" : "div");
          card.className = "project-card";
          if (hasUrl) {
            card.href = safeUrl(project.url);
            card.target = "_blank";
            card.rel = "noopener noreferrer";
          } else {
            card.classList.add("no-link");
          }

          const icon = document.createElement("div");
          icon.className = "project-icon";
          icon.textContent = project.icon || "🌸";
          card.appendChild(icon);

          const title = document.createElement("h3");
          title.className = "project-title";
          title.textContent = project.title || "未命名项目";
          card.appendChild(title);

          if (project.description) {
            const desc = document.createElement("p");
            desc.className = "project-desc";
            desc.textContent = project.description;
            card.appendChild(desc);
          }

          if (Array.isArray(project.tags) && project.tags.length) {
            const tags = document.createElement("div");
            tags.className = "project-tags";
            project.tags.forEach(tag => tags.appendChild(createTag(tag)));
            card.appendChild(tags);
          }

          grid.appendChild(card);
        });
      }

      function render(data) {
        const site = data.site || {};
        document.title = site.title || "樱花小站";
        $("siteEyebrow").textContent = site.eyebrow || "SAKURA PORTFOLIO";
        $("siteTitle").textContent = site.title || "樱花小站";
        $("siteSubtitle").textContent = site.subtitle || "";
        $("footer").textContent = site.footer || "© " + new Date().getFullYear() + " 樱花小站";
        renderProfile(data.profile || {});
        renderProjects(Array.isArray(data.projects) ? data.projects : []);

        document.querySelectorAll(".profile-card, .project-card").forEach((el, index) => {
          el.classList.remove("appear");
          void el.offsetWidth;
          el.classList.add("appear");
          el.style.animationDelay = index * 60 + "ms";
        });
      }

      async function loadDataFromUrl(isManual) {
        if (loading) return;
        loading = true;

        const refreshBtn = $("refreshBtn");
        const mainContent = $("mainContent");
        refreshBtn.disabled = true;
        refreshBtn.classList.add("loading");
        mainContent.classList.add("refreshing");
        setStatus(isManual ? "正在手动拉取..." : "正在加载...");

        try {
          const response = await fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" });
          if (!response.ok) throw new Error("HTTP " + response.status + "，请确认 index.json 与 index.html 是否在同一目录");

          let text = await response.text();
          text = text.replace(/^\uFEFF/, "");
          let data;
          try {
            data = JSON.parse(text);
          } catch (e) {
            throw new Error("index.json 格式错误：" + e.message);
          }
          if (!data || typeof data !== "object" || Array.isArray(data)) {
            throw new Error("JSON 根节点必须是一个对象");
          }

          render(data);
          const time = new Date().toLocaleTimeString("zh-CN", { hour12: false });
          setStatus((isManual ? "手动刷新成功" : "加载成功") + " · " + time);
          if (isManual) showToast("已拉取最新数据 🌸");
        } catch (error) {
          console.error(error);
          setStatus("加载失败");
          showToast("加载失败：" + error.message, true);
        } finally {
          loading = false;
          refreshBtn.disabled = false;
          refreshBtn.classList.remove("loading");
          mainContent.classList.remove("refreshing");
          $("loadingOverlay").classList.add("hidden");
        }
      }

      $("refreshBtn").addEventListener("click", () => loadDataFromUrl(true));
      createSakura();
      loadDataFromUrl(false);
    })();
  </script>
</body>
</html>
